<title>My Life App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Header with back/undo, one page at a time, fixed bottom tab bar. Forms open as a bottom sheet. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#16202e; --muted:#5d6878; --line:#dde2ea;
  --accent:#1f4fd1; --accent-ink:#ffffff; --today:#f2b630;
  --good:#0e7c66; --warn:#b45309; --crit:#b3261e; --track:#e6eaf0; --scrim:rgba(10,16,26,.5);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b6; --line:#2a3442;
  --accent:#7ea2ff; --accent-ink:#0f141c; --good:#4fd1b0; --warn:#f0a65a; --crit:#ff8a80; --track:#2a3442;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b6; --line:#2a3442;
  --accent:#7ea2ff; --accent-ink:#0f141c; --good:#4fd1b0; --warn:#f0a65a; --crit:#ff8a80; --track:#2a3442;
  color-scheme:dark}
html,body{background:var(--bg)}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 120px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:1.12rem;margin:0}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hdr .l{min-width:0;flex:1}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.tile.main{grid-column:1/-1}
button.tile{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;cursor:pointer}
.tile .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--display);font-weight:800;font-size:1.45rem;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.tile.main .val{font-size:2rem}
.tile .note{font-size:.8rem;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font-weight:600;min-width:0;overflow-wrap:anywhere;flex:1}
button.row{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
li:first-child>button.row{border-top:0}
.row .hint,.hint{font-size:.8rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--crit)} .amt.pos{color:var(--good)}
.money{display:flex;align-items:center;gap:4px;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;width:9.5rem;box-sizing:border-box}
.money span{color:var(--muted)}
.money input{font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;border:0;outline:0;width:100%;min-width:0;padding:10px 0;text-align:right}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.money.bad{border-color:var(--crit)}
.cardrow{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cardrow:first-child{border-top:0}
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.big{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);margin-left:6px;vertical-align:middle}
.chip.due{color:var(--warn);border-color:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.acc{background:var(--accent)}
.meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
details{font-size:.9rem}
summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content}
:is(summary,.btn,.tabbar button,a,.entry,.nav,.lnk,.check,.habit,.qchip,.link,button.row,button.tile,.seg button):focus-visible{outline:2px solid var(--today);outline-offset:2px}
.edit{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.edit .money{width:8.5rem}
.prog{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:10px 16px;width:max-content;box-sizing:border-box;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--crit)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
.badge{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 9px;flex:none;border:1px solid var(--line);color:var(--muted)}
.badge.good{color:var(--good);border-color:var(--good)} .badge.warn{color:var(--warn);border-color:var(--warn)} .badge.crit{color:var(--crit);border-color:var(--crit)} .badge.acc{color:var(--accent);border-color:var(--accent)}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--crit)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
  display:flex;gap:2px;justify-content:center}
.tabbar button{all:unset;cursor:pointer;flex:1;max-width:110px;text-align:center;padding:10px 2px;border-radius:10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.undobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;font-size:.88rem;max-width:calc(100% - 32px);box-sizing:border-box;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.undobar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undobar button{all:unset;cursor:pointer;font-weight:700;color:var(--today);padding:6px 8px;flex:none}
a{color:var(--accent);font-weight:600}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav h2{font-size:1.15rem;text-align:center;flex:1}
.nav{all:unset;cursor:pointer;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;line-height:44px;font-size:1.3rem;color:var(--ink);flex:none}
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.weekhead{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.weekhead .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.weekhead b{font-family:var(--display);font-size:1.05rem}
.paycheck{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ok{color:var(--good);font-weight:600} .off{color:var(--crit);font-weight:600} .wait{color:var(--warn);font-weight:600}
.day{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.week .day:first-of-type{border-top:0}
.day.today{box-shadow:inset 3px 0 0 var(--today)}
.dlabel{width:4.4rem;flex:none;font-weight:600;font-size:.9rem;padding-top:8px}
.dlabel small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.ents{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.none{color:var(--muted);font-size:.85rem;padding-top:8px}
.entry{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);box-sizing:border-box;min-width:0}
.entry b{font-size:.92rem}
.entry span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.entry .st-paid{color:var(--good)} .entry .st-due{color:var(--warn)}
.entry.offd{opacity:.7}
.owedrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* today */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.habit b{font-size:.95rem} .habit span{font-size:.8rem;color:var(--muted)}
.habit[aria-pressed="true"]{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.habit[aria-pressed="true"] b::before{content:"✓ ";color:var(--good)}
.tl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tl li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .tm{width:3.3rem;flex:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem;color:var(--muted)}
.tl .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.tl .tx small{display:block;color:var(--muted);font-size:.78rem}
.tl li.shift{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tl li.done .tx>span{text-decoration:line-through;color:var(--muted)}
.check{all:unset;cursor:pointer;width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);box-sizing:border-box;text-align:center;line-height:22px;font-size:.9rem;color:var(--accent-ink)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tx button{all:unset;cursor:pointer}
.addtask{display:grid;grid-template-columns:1fr auto;gap:8px}
.addtask input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;flex:1;text-align:center;padding:9px 4px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.link{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.link b{font-size:.95rem} .link small{color:var(--muted);font-size:.78rem}
.topic{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic span{flex:1;font-size:.9rem}
/* chat */
.chatlog{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.act{align-self:flex-start;background:transparent;color:var(--good);font-size:.82rem;padding:2px 4px}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchip{all:unset;cursor:pointer;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface);color:var(--ink)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:0;resize:none;min-height:44px;max-height:140px;box-sizing:border-box}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;box-sizing:border-box;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600;min-width:0}
.field[hidden]{display:none}
.field input,.field select,.field textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;box-sizing:border-box}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two[hidden]{display:none}
.preview{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.preview[hidden]{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--crit);font-size:.85rem;min-height:1.2em}
@media (prefers-reduced-motion:reduce){.bar i,.prog i{transition:none}}
</style>

<div class="wrap">
  <header class="hdr">
    <div class="l">
      <button class="lnk" id="back" type="button" hidden>‹ Back</button>
      <h1 id="ptitle">My Life App</h1>
      <div class="sub" id="psub"></div>
    </div>
    <button class="btn ghost small" id="undoBtn" type="button" hidden>Undo</button>
  </header>
  <main id="view" style="display:flex;flex-direction:column;gap:16px"><div class="status">Loading your app…</div></main>
  <div class="status" id="status" role="status"></div>
</div>
<div class="undobar" id="undobar" hidden><span id="undotext"></span><button type="button" id="undobarBtn">Undo</button></div>
<div class="scrim" id="sheet" hidden></div>

<script>
/*CALC*/
const DEF={samRate:10.4,robDay:75,travel:60};
const DAYDEF={wake:"08:00",bed:"23:30",book:"Meditations",medMins:10,readMins:15};
const JOBS={
  sam_morning:{label:"Sam's morning",sam:true},sam_night:{label:"Sam's night",sam:true},sam_double:{label:"Sam's double",sam:true},
  electrician:{label:"Electrician (Rob)",rob:true},cleaning:{label:"Cleaning",side:true},gardening:{label:"Gardening",side:true},
  construction:{label:"Construction",side:true},day_off:{label:"Day off",off:true}
};
const EXP_CATS=["Sri Lanka","Rent","Food","Transport","Phone contract","Subscriptions","Shopping","Education","Business","Other"];
const INC_SRC=["Salary","Business","Gift","Refund","Other"];
const BIZ=["Personal","Zeilan Paradise","Zeilan Apparel"];
const TAGS=["Personal","Zeilan Paradise","Zeilan Apparel","Study","Job hunt","Home"];
const JOB_STATUS=["Applied","Online test","Interview","Offer","Rejected","No reply"];
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const ds=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+n);return ds(d)};
const dow=s=>(pd(s).getUTCDay()+6)%7;
const weekStart=s=>addDays(s,-dow(s));
const sundaysIn=(y,m)=>{const first=`${y}-${String(m).padStart(2,"0")}-01`;let s=addDays(first,(6-dow(first)+7)%7);const out=[];while(+s.slice(5,7)===m){out.push(s);s=addDays(s,7)}return out};
const toMin=t=>{const[a,b]=String(t).split(":").map(Number);return a*60+b};
const fromMin=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const leaveAt=(start,travel)=>fromMin(toMin(start)-travel);
const endLabel=(start,hh)=>{const t=toMin(start)+Math.round(hh*60);return fromMin(t)+(t>=1440?" (next day)":"")};
function samDefaults(job,date){
  const late=dow(date)>=3;
  if(job==="sam_morning")return{start:"10:00",hours:8};
  if(job==="sam_night")return{start:"18:00",hours:late?8.5:6.5};
  if(job==="sam_double")return{start:"10:00",hours:late?16.5:14.5};
  return null;
}
const shiftHours=s=>(Number(s.hours)||0)+(Number(s.extra)||0)+(Number(s.early)||0);
const realStart=s=>fromMin(toMin(s.start)-Math.round((Number(s.early)||0)*60));
const realEnd=s=>endLabel(s.start,(Number(s.hours)||0)+(Number(s.extra)||0));
const penceFor=(hrs,rate)=>Math.round(hrs*Math.round(rate*100));
const toP=v=>Math.round((Number(v)||0)*100);
function jobAmountP(s,robDay){
  if(JOBS[s.job]?.rob)return s.amount!=null&&s.amount!==""?toP(s.amount):toP(robDay);
  if(JOBS[s.job]?.side)return toP(s.amount);
  return 0;
}
function weekCalc(shifts,ws,rate,robDay){
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const list=shifts.filter(s=>days.includes(s.date));
  const samH=list.filter(s=>JOBS[s.job]?.sam).reduce((t,s)=>t+shiftHours(s),0);
  const robP=list.filter(s=>JOBS[s.job]?.rob).reduce((t,s)=>t+jobAmountP(s,robDay),0);
  const sideP=list.filter(s=>JOBS[s.job]?.side).reduce((t,s)=>t+jobAmountP(s,robDay),0);
  return{ws,days,list,samH,samP:penceFor(samH,rate),robP,sideP};
}
function robAlloc(shifts,payments,robDay){
  const days=shifts.filter(s=>s.job==="electrician").sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1));
  let rem=payments.filter(p=>p.source==="rob").reduce((t,p)=>t+toP(p.amount),0);
  const paidTotal=rem,byId={};let earned=0;
  for(const s of days){const amt=jobAmountP(s,robDay);earned+=amt;const paid=Math.min(amt,Math.max(rem,0));rem-=paid;byId[s.id]={amt,paid}}
  return{byId,earned,paidTotal,balance:earned-paidTotal};
}
function sidePending(shifts,payments){
  const paidRef=new Set(payments.filter(p=>p.source==="job").map(p=>p.ref));
  return shifts.filter(s=>JOBS[s.job]?.side&&toP(s.amount)>0&&!paidRef.has(s.id));
}
function samPendingWeeks(shifts,payments,rate,robDay,today){
  const paid=new Set(payments.filter(p=>p.source==="sam").map(p=>p.ref));
  const wss=[...new Set(shifts.filter(s=>JOBS[s.job]?.sam).map(s=>weekStart(s.date)))];
  return wss.filter(ws=>addDays(ws,6)<today&&!paid.has(ws)).map(ws=>weekCalc(shifts,ws,rate,robDay)).filter(w=>w.samP>0);
}
/* Money flow for one account key: "cash", a bank id, "<bank>:sav", or a card id. In = +, out = -. */
function flowP(key,entries,payments){
  let t=0;
  for(const p of payments)if(p.account===key)t+=toP(p.amount);
  for(const e of entries){
    if(e.kind==="adjust"){if(e.account===key)t+=toP(e.amount);continue}
    if(e.to===key)t+=toP(e.amount);
    if(e.from===key)t-=toP(e.amount);
  }
  return t;
}
const monthOf=d=>String(d||"").slice(0,7);
function monthSpend(entries,ym){
  const by={};let total=0;
  for(const e of entries)if(e.kind==="expense"&&monthOf(e.date)===ym){const c=e.cat||"Other";by[c]=(by[c]||0)+toP(e.amount);total+=toP(e.amount)}
  return{by,total};
}
function monthReceived(entries,payments,ym){
  const src={"Sam's":0,"Electrician":0,"Side jobs":0,"Other income":0};
  for(const p of payments)if(monthOf(p.date)===ym){const k=p.source==="sam"?"Sam's":p.source==="rob"?"Electrician":"Side jobs";src[k]+=toP(p.amount)}
  for(const e of entries)if(e.kind==="income"&&monthOf(e.date)===ym)src["Other income"]+=toP(e.amount);
  return{src,total:Object.values(src).reduce((a,b)=>a+b,0)};
}
function bizTotals(entries,biz,ym){
  let inc=0,cost=0,lkr=0;
  for(const e of entries){
    if((e.biz||"Personal")!==biz)continue;if(ym&&monthOf(e.date)!==ym)continue;
    if(e.kind==="income")inc+=toP(e.amount);else if(e.kind==="expense"){cost+=toP(e.amount);lkr+=Number(e.lkr)||0}
  }
  return{inc,cost,profit:inc-cost,lkr};
}
function dayPlan(dayShifts,dayTasks,wake,bed,travel,wind=60){
  const wakeM=toMin(wake);let bedM=toMin(bed);if(bedM<=wakeM)bedM+=1440;
  const blocks=[];
  for(const s of dayShifts){
    if(!s.start||!(Number(s.hours)>0))continue;
    const st=toMin(s.start)-Math.round((Number(s.early)||0)*60),en=toMin(s.start)+Math.round(((Number(s.hours)||0)+(Number(s.extra)||0))*60);
    blocks.push([st-travel,en+travel]);
  }
  const endM=Math.max(bedM,...blocks.map(b=>b[1]+wind));
  const cl=blocks.map(([a,b])=>[Math.max(a,wakeM),Math.min(b,endM)]).filter(([a,b])=>b>a).sort((x,y)=>x[0]-y[0]);
  let busy=0,cur=null;
  for(const b of cl){if(!cur||b[0]>cur[1]){if(cur)busy+=cur[1]-cur[0];cur=[...b]}else cur[1]=Math.max(cur[1],b[1])}
  if(cur)busy+=cur[1]-cur[0];
  const taskM=dayTasks.reduce((t,x)=>t+(Number(x.mins)||0),0);
  return{wakeM,endM,busy,taskM,free:Math.max(0,endM-wakeM-busy-taskM)};
}
function streak(habits,key,today){
  const done=new Set(habits.filter(x=>x[key]).map(x=>x.id));
  let d=done.has(today)?today:addDays(today,-1),n=0;
  while(done.has(d)){n++;d=addDays(d,-1)}
  return n;
}

function dbDo(key,fn){

function entryTitle(e){
  if(e.kind==="expense")return(e.cat||"Expense")+(e.note?" · "+e.note:"");
  if(e.kind==="income")return(e.cat||"Income")+(e.note?" · "+e.note:"");
  if(e.kind==="transfer")return`${accName(e.from)} → ${accName(e.to)}`+(e.note?" · "+e.note:"");
  if(e.kind==="adjust")return"Balance corrected: "+accName(e.account);
  if(e.kind==="loan")return e.note||"Lending";
  return e.kind;
}
function entryAmt(e){
  const p=toP(e.amount);
  if(e.kind==="expense")return h("span",{class:"amt neg"},"−"+fmtP(p));
  if(e.kind==="income")return h("span",{class:"amt pos"},"+"+fmtP(p));
  if(e.kind==="adjust")return h("span",{class:"amt"},(p>=0?"+":"−")+fmtP(Math.abs(p)));
  if(e.kind==="loan")return h("span",{class:"amt"},(e.from?"−":"+")+fmtP(p));
  return h("span",{class:"amt"},fmtP(p));
}
function entryMeta(e){
  const bits=[fmtShort(e.date)];
  if(e.kind==="expense")bits.push(accName(e.from));
  if(e.kind==="income")bits.push(accName(e.to));
  if(e.biz&&e.biz!=="Personal")bits.push(e.biz);
  if(e.lkr)bits.push(fmtRs(e.lkr));
  return bits.join(" · ");
}

let flowFilter="All";
function ledger(ym){
  const rows=[];
  S.payments.filter(p=>monthOf(p.date)===ym).forEach(p=>{
    const s=p.source==="job"?docOf("shifts",p.ref):null;
    const title=p.source==="sam"?"Sam's pay":p.source==="rob"?"Rob, electrician pay":`${s?JOBS[s.job]?.label:"Side job"} pay`;
    rows.push({date:p.date,dir:"in",amt:toP(p.amount),title,meta:`${fmtShort(p.date)} · into ${accName(p.account)}${p.source==="sam"?" · week of "+fmtShort(p.ref):""}`,open:()=>openPayView(p,title)});
  });
  S.entries.filter(e=>monthOf(e.date)===ym).forEach(e=>{
    const dir=e.kind==="expense"?"out":e.kind==="income"?"in":"move";
    rows.push({date:e.date,dir,amt:toP(e.amount),title:entryTitle(e),meta:entryMeta(e)+(e.kind==="transfer"?" · transfer":e.kind==="loan"?" · lending":e.kind==="adjust"?" · correction":""),e,
      open:()=>e.kind==="adjust"?openCorrect(e.account,e):e.kind==="loan"?openEntryView(e):openEntry(e.kind,{},e)});
  });
  return rows.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}

const QUICK=["I worked Sam's night today","Rob paid me £","Spent £ on food from Monzo","Sent £ to Sri Lanka","Add a task for tomorrow: ","I meditated and read today","What's my money looking like?","Undo that"];
function viewChat(){
  const out=[];
  if(sampleFn===null){out.push(h("div",{class:"card"},h("h2",{},"Assistant unavailable"),h("div",{class:"meta"},"Chat needs Claude in this view. Everything else in the app still works.")));return out}
  out.push(h("div",{class:"meta"},"Type what happened and it logs it for you. Every change can be undone. Each message uses a little of your Claude usage."));
  const log=h("div",{class:"chatlog",id:"chatlog"});
  if(!CHAT.length)log.append(h("div",{class:"msg bot"},"Hi Yasintha. Tell me things like \"Sam's night tonight\", \"Rob gave me £150\", \"£12 Tesco on Monzo\", or \"remind me to call the bank tomorrow at 10\"."));
  CHAT.forEach((m,i)=>log.append(h("div",{class:"msg "+(m.role==="user"?"user":m.role==="act"?"act":"bot"),"data-mi":String(i)},m.text||"…")));
  out.push(log);
  const ta=h("textarea",{id:"chatin",rows:"1",placeholder:"Type a message…","aria-label":"Message",maxlength:"2000"});
  try{ta.value=sessionStorage.getItem("lifeDraft")||""}catch(e){}
  ta.addEventListener("input",()=>{try{sessionStorage.setItem("lifeDraft",ta.value)}catch(e){}});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat()}});
  out.push(h("div",{class:"qchips"},QUICK.map(q=>h("button",{class:"qchip",type:"button",onclick:()=>{const t=$("chatin");t.value=q;t.focus();t.setSelectionRange(q.length,q.length)}},q))));
  out.push(h("div",{class:"composer"},ta,chatBusy?h("button",{class:"btn ghost",type:"button",onclick:()=>chatCtl?.abort()},"Stop"):h("button",{class:"btn",type:"button",onclick:sendChat},"Send")));
  if(CHAT.length)out.push(h("button",{class:"lnk",type:"button",onclick:()=>{CHAT.length=0;saveChat();render(true)}},"Clear chat"));
  setTimeout(()=>{const l=$("chatlog");if(l)l.lastElementChild?.scrollIntoView({block:"end"})},0);
  return out;
}
async function sendChat(){
  const ta=$("chatin");if(!ta||chatBusy)return;const text=ta.value.trim();if(!text)return;
  if(!canWrite){setStatus("View only: the assistant can't change anything.",true);return}
  if(sampleFn===undefined)sampleFn=await claude.use("sample");
  if(!sampleFn){render(true);return}
  ta.value="";try{sessionStorage.removeItem("lifeDraft")}catch(e){}
  CHAT.push({role:"user",text});const bot={role:"bot",text:"Thinking…"};CHAT.push(bot);chatBusy=true;saveChat();render(true);
  const turns=[{role:"user",content:chatContext()}];
  CHAT.slice(0,-1).slice(-14).forEach(m=>{if(m.role==="user")turns.push({role:"user",content:m.text});else if(m.role==="bot"&&m.text&&m.text!=="Thinking…")turns.push({role:"assistant",content:m.text})});
  while(turns.length>1&&turns[1].role==="assistant")turns.splice(1,1);
  chatCtl=new AbortController();
  const paintBot=()=>{const i=CHAT.indexOf(bot),el=document.querySelector(`[data-mi="${i}"]`);if(el)el.textContent=bot.text};
  try{
    const r=await sampleFn(turns,{tools:TOOLS,modelTier:"quick",signal:chatCtl.signal,onText:({text})=>{bot.text=text;paintBot()}});
    bot.text=r.text+(r.truncated?"\n(cut short)":"");
  }catch(e){
    const code=e&&e.code;
    if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"||code==="tools_unavailable"){bot.text="The assistant isn't allowed here. Everything else still works.";}
    else if(code==="cancelled")bot.text=(e.text||"")+" (stopped)";
    else if(code==="rate_limited")bot.text="You've hit a usage limit for now. Try again later.";
    else bot.text=(e&&e.text?e.text+"\n":"")+"Something went wrong. Try again.";
  }finally{chatBusy=false;chatCtl=null;saveChat();render(true)}
}

if(!VIEWS[tab])tab="today";if(!TABS.some(x=>x[0]===parent))parent="today";
function go(t){
  if(!VIEWS[t])return;
  if(TABS.some(x=>x[0]===t))parent=t;else if(TABS.some(x=>x[0]===tab))parent=tab;
  tab=t;try{localStorage.setItem("lifeTab",t);localStorage.setItem("lifeParent",parent)}catch(e){}
  render(true);window.scrollTo(0,0);
}
$("back").onclick=()=>go(parent);
function editing(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$("view").contains(a)}
function render(force){
  if(!force&&editing()){dirty=true;return}
  dirty=false;
  const tb=$("tabbar");tb.innerHTML="";
  const isTab=TABS.some(x=>x[0]===tab);
  TABS.forEach(([k,l])=>{const b=h("button",{type:"button"},l);if(k===(isTab?tab:parent))b.setAttribute("aria-current","page");b.onclick=()=>go(k);tb.appendChild(b)});
  $("back").hidden=isTab;
  const[t,s]=TITLES[tab];$("ptitle").textContent=t;
  $("psub").textContent=tab==="today"?fmtLong(dayView):s;
  $("undoBtn").hidden=!UNDO.length;
  const v=$("view");
  const y=window.scrollY;
  v.innerHTML="";
  if(!ready()){v.append(h("div",{class:"status"},"Loading your app…"));return}
  VIEWS[tab]().forEach(e=>{if(e)v.append(e)});
  paint();
  if(!force)window.scrollTo(0,y);
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty&&!editing())render()},0));
render(true);
